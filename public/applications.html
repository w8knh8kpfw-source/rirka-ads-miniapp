<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Мои заявки — RIRKA Ads</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"SF Pro Text",
"Helvetica Neue",
Arial,
sans-serif;


background:

radial-gradient(
circle at 15% 15%,
rgba(0,122,255,.45),
transparent 35%
),

radial-gradient(
circle at 85% 20%,
rgba(175,82,222,.45),
transparent 40%
),

radial-gradient(
circle at 50% 90%,
rgba(52,199,89,.3),
transparent 40%
),

#f2f2f7;


padding:25px;

overflow:hidden;

}



/* Движущиеся цвета */

body::before{

content:"";

position:fixed;

width:450px;
height:450px;


background:

linear-gradient(
135deg,
rgba(0,122,255,.35),
rgba(175,82,222,.35),
rgba(255,45,85,.25)
);


border-radius:50%;


top:-150px;
right:-150px;


filter:blur(80px);


animation:

moveColor 18s ease-in-out infinite alternate;


}



body::after{

content:"";

position:fixed;

width:400px;
height:400px;


background:

linear-gradient(
135deg,
rgba(52,199,89,.35),
rgba(0,122,255,.3),
rgba(255,204,0,.25)
);


border-radius:50%;


bottom:-150px;
left:-150px;


filter:blur(90px);


animation:

moveColor2 22s ease-in-out infinite alternate;


}




@keyframes moveColor{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(-80px,120px) scale(1.15);
}

100%{
transform:translate(60px,40px) scale(.95);
}

}



@keyframes moveColor2{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(100px,-80px) scale(1.2);
}

100%{
transform:translate(-50px,50px) scale(1);
}

}




.container{

max-width:430px;

margin:auto;

}



h1{

font-size:40px;

font-weight:850;

letter-spacing:-2px;

margin-top:20px;

}



.subtitle{

font-size:18px;

font-weight:500;

color:#6e6e73;

margin-bottom:30px;

}





.glass{

position:relative;

overflow:hidden;


background:

linear-gradient(
135deg,
rgba(255,255,255,.18),
rgba(255,255,255,.05)
);



backdrop-filter:

blur(90px)
saturate(240%);


-webkit-backdrop-filter:

blur(90px)
saturate(240%);



border:

1px solid rgba(255,255,255,.55);



box-shadow:

0 40px 120px rgba(0,0,0,.18),

inset 0 1px 4px rgba(255,255,255,.8),

inset 0 -30px 60px rgba(255,255,255,.08);



border-radius:45px;

padding:35px;

}




.glass::before{

content:"";

position:absolute;

inset:-100px;


background:

conic-gradient(

from 180deg,

rgba(255,255,255,.5),

rgba(0,122,255,.25),

rgba(175,82,222,.3),

rgba(255,45,85,.25),

rgba(255,255,255,.5)

);



filter:blur(50px);

opacity:.35;


animation:

rotateGlass 12s linear infinite;


}



@keyframes rotateGlass{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}




.content{

position:relative;

z-index:2;

}



.icon{

font-size:50px;

}



.empty-title{

font-size:26px;

font-weight:800;

letter-spacing:-1px;

margin-top:20px;

}



.empty-text{

font-size:17px;

line-height:1.5;

color:#6e6e73;

margin-top:12px;

}





.button{


margin-top:30px;


height:60px;


border-radius:30px;


display:flex;

align-items:center;

justify-content:center;



background:

rgba(255,255,255,.22);



border:

1px solid rgba(255,255,255,.65);



backdrop-filter:

blur(40px);



font-size:18px;

font-weight:700;



box-shadow:

0 20px 50px rgba(0,0,0,.15);



transition:.2s;

}



.button:active{

transform:scale(.94);

}


</style>


</head>



<body>


<div class="container">


<h1>
📋 Мои заявки
</h1>


<div class="subtitle">

История ваших рекламных размещений

</div>



<div class="glass">


<div class="content">


<div class="icon">
✨
</div>



<div class="empty-title">

<div class="empty-text">

Создайте первую заявку RIRKA Ads.

</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_KEY = 8511758178:AAFfziGA-De9gOyf-0YZ0BRH7MQ5XQh1JEA"";


const supabaseClient = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function loadApplications(){

return;

}

}


loadApplications();

</body>
