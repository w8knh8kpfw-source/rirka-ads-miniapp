<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIRKA Ads</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Helvetica Neue",
Arial,
sans-serif;

color:#111;

overflow:hidden;


background:#f5f5f7;

}


/* мягкие световые облака */

body::before,
body::after{

content:"";

position:fixed;

border-radius:50%;

filter:blur(120px);

z-index:-2;

}



body::before{

width:600px;
height:600px;

top:-220px;
left:-220px;


background:

radial-gradient(
circle,
rgba(120,170,255,.45),
transparent 70%
);


animation:
blueMove 20s infinite alternate ease-in-out;

}



body::after{

width:650px;
height:650px;

right:-250px;
bottom:-250px;


background:

radial-gradient(
circle,
rgba(190,150,255,.35),
transparent 70%
);


animation:
purpleMove 24s infinite alternate ease-in-out;

}



@keyframes blueMove{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(120px,120px) scale(1.2);
}

100%{
transform:translate(-50px,200px) scale(1);
}

}



@keyframes purpleMove{

0%{
transform:translate(0,0) scale(1);
}

50%{
transform:translate(-130px,-100px) scale(1.25);
}

100%{
transform:translate(80px,-40px) scale(1);
}

}



/* контейнер */


.app{

max-width:430px;

margin:auto;

padding:25px 20px 140px;

position:relative;

}




/* верх */


.header{

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:25px;

font-weight:800;

letter-spacing:-1px;

}



.avatar{

width:52px;

height:52px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

}




.avatar img{

width:100%;

height:100%;

border-radius:50%;

object-fit:cover;

}





/* жидкое стекло */


.avatar,
.glass,
.liquid-button,
.dock{


position:relative;

overflow:hidden;


background:

linear-gradient(
135deg,
rgba(255,255,255,.30),
rgba(255,255,255,.06)
);



backdrop-filter:

blur(45px)
saturate(170%);



-webkit-backdrop-filter:

blur(45px)
saturate(170%);



border:

1px solid rgba(255,255,255,.65);



box-shadow:


inset 0 1px 8px rgba(255,255,255,.9),


inset 0 -30px 60px rgba(255,255,255,.08),


0 35px 100px rgba(0,0,0,.12);

}



/* блик */


.glass::after,
.avatar::after,
.liquid-button::after,
.dock::after{


content:"";

position:absolute;

top:-120%;

left:-160%;


width:100%;

height:300%;


background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.6),
transparent
);



transform:rotate(25deg);


animation:

shine 9s infinite;

}



@keyframes shine{

0%{
left:-160%;
}

35%,
100%{
left:160%;
}

}
  @keyframes shine{

0%{
left:-160%;
}

35%,
100%{
left:160%;
}

}



/* главный блок */


.hero{

margin-top:45px;

}



.hero h1{

font-size:42px;

line-height:1.05;

letter-spacing:-2.5px;

font-weight:850;

margin:0;

}



.hero p{

font-size:17px;

line-height:1.45;

color:#6e6e73;

}






/* карточка */


.glass{

margin-top:35px;

padding:30px;

border-radius:42px;

}



.title{

font-size:27px;

font-weight:800;

letter-spacing:-1px;

}



.text{

margin-top:12px;

font-size:16px;

line-height:1.5;

color:#6e6e73;

}




/* кнопка */


.liquid-button{

margin-top:28px;

height:64px;

border-radius:32px;


display:flex;

align-items:center;

justify-content:center;


font-size:18px;

font-weight:700;


cursor:pointer;


transition:.25s;

}



.liquid-button:active{

transform:scale(.92);

}







/* активность */


.section{

margin-top:38px;

font-size:23px;

font-weight:800;

}



.status{

margin-top:15px;

padding:24px;

border-radius:34px;



background:

rgba(255,255,255,.18);



backdrop-filter:

blur(45px);



-webkit-backdrop-filter:

blur(45px);



border:

1px solid rgba(255,255,255,.55);



color:#6e6e73;

}






/* нижнее меню */


.dock{


position:fixed;


bottom:18px;


left:50%;


transform:translateX(-50%);



width:90%;


max-width:390px;



height:88px;


border-radius:45px;



padding:12px;



display:flex;

align-items:center;

justify-content:space-around;


}



.item{


width:100px;

height:65px;


border-radius:30px;



display:flex;

flex-direction:column;


align-items:center;


justify-content:center;



font-size:12px;



color:#8e8e93;



cursor:pointer;



transition:.25s;

}



.icon{

font-size:28px;

}



.item.active{


background:

rgba(255,255,255,.5);



color:#000;



box-shadow:


inset 0 0 35px rgba(255,255,255,.9),


0 15px 40px rgba(0,0,0,.12);

}



.item:active{

transform:scale(.88);

}





</style>

</head>


<body>


<div class="app">


<div class="header">


<div class="logo">

⭐ RIRKA Ads

</div>


<div class="avatar">

<img id="userPhoto" src="" alt="">

</div>


</div>


<div id="welcome" style="
margin-top:20px;
font-size:18px;
font-weight:600;
">

</div>


<div class="hero">


<h1>

Реклама.<br>
Новый уровень.

</h1>


<p>

Создавайте заявки и получайте размещение через проверку администрации.

</p>


</div>


<div class="glass">


<div class="title">

📝 Создать заявку

</div>


<div class="text">

Опишите вашу рекламу и получите ответ с условиями размещения.

</div>


<div class="liquid-button"
onclick="window.location.href='form.html'">

✨ Начать

</div>


</div>
  <div class="section">

Активность

</div>



<div class="status">

⏳ Нет активных заявок

</div>



</div>






<div class="dock">



<div class="item active"
onclick="window.location.href='index.html'">


<div class="icon">

⌂

</div>


Главная


</div>





<div class="item"
onclick="window.location.href='applications.html'">


<div class="icon">

▤

</div>


Заявки


</div>





<div class="item"
onclick="window.location.href='profile.html'">


<div class="icon">

◯

</div>


Профиль


</div>



</div>







<script src="https://telegram.org/js/telegram-web-app.js"></script>



<script>


const tg = window.Telegram.WebApp;



tg.ready();



const user = tg.initDataUnsafe.user;





if(user && user.photo_url){


document.getElementById("userPhoto").src = user.photo_url;


}





if(user){


document.getElementById("welcome").innerText =

"Привет, " + (user.first_name || "пользователь") + " 👋";


}



</script>



</body>

</html>
