<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIRKA Ads</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
sans-serif;


color:#111;

overflow-x:hidden;


background:

radial-gradient(
circle at 50% 40%,
rgba(255,255,255,.9),
transparent 30%
),

radial-gradient(
circle at 20% 80%,
rgba(120,255,220,.35),
transparent 35%
),

#f2f2f7;

}



/* ФОНОВЫЕ СВЕТОВЫЕ ПЯТНА */


body::before,
body::after{

content:"";

position:fixed;

border-radius:50%;

filter:blur(90px);

z-index:-1;

}



body::before{

width:500px;

height:500px;


top:-150px;

left:-150px;



background:

radial-gradient(
circle,
rgba(100,180,255,.7),
transparent 65%
);



animation:

blueMove 14s infinite alternate ease-in-out;


}




body::after{


width:550px;

height:550px;


bottom:-180px;

right:-180px;



background:

radial-gradient(
circle,
rgba(220,140,255,.7),
transparent 65%
);



animation:

purpleMove 16s infinite alternate ease-in-out;


}



@keyframes blueMove{

from{
transform:translate(0,0);
}

to{
transform:translate(150px,180px);
}

}


@keyframes purpleMove{

from{
transform:translate(0,0);
}

to{
transform:translate(-150px,-120px);
}

}



/* APP */


.app{

max-width:430px;

margin:auto;

padding:

25px 20px 140px;


}



/* HEADER */


.header{

display:flex;

justify-content:space-between;

align-items:center;

}



.logo{

font-size:24px;

font-weight:700;

}



.avatar{

width:46px;

height:46px;

border-radius:50%;


display:flex;

align-items:center;

justify-content:center;


font-size:20px;


}





/* ОБЩИЙ LIQUID GLASS */


.avatar,
.glass,
.liquid-button,
.dock{


position:relative;

overflow:hidden;



background:

linear-gradient(

135deg,

rgba(255,255,255,.7),

rgba(255,255,255,.18)

);



backdrop-filter:

blur(55px)
saturate(200%);



-webkit-backdrop-filter:

blur(55px)
saturate(200%);



border:

1px solid rgba(255,255,255,.7);



box-shadow:


inset 0 1px 2px rgba(255,255,255,.9),


inset 0 -20px 40px rgba(255,255,255,.12),


0 30px 80px rgba(0,0,0,.14);


}





/* БЛИК НА СТЕКЛЕ */


.avatar::after,
.glass::after,
.liquid-button::after,
.dock::after{


content:"";


position:absolute;


top:-80%;

left:-120%;


width:80%;

height:250%;



background:

linear-gradient(

120deg,

transparent,

rgba(255,255,255,.6),

transparent

);



transform:rotate(25deg);



animation:

shine 9s infinite;



}



@keyframes shine{


0%{

left:-120%;

}


25%,
100%{

left:150%;

}


}





/* HERO */


.hero{

margin-top:45px;

}



.hero h1{


font-size:40px;

line-height:1.05;

letter-spacing:-2px;

margin:0;


}



.hero p{


font-size:17px;

line-height:1.4;

color:#6e6e73;


}




/* CARD */


.glass{


margin-top:30px;

padding:28px;

border-radius:36px;


}



.title{

font-size:26px;

font-weight:700;

}



.text{

margin-top:10px;

color:#6e6e73;

line-height:1.4;


}



/* BUTTON */


.liquid-button{


margin-top:25px;

height:62px;

border-radius:25px;



display:flex;

align-items:center;

justify-content:center;


font-size:18px;

font-weight:600;


transition:.2s;


}



.liquid-button:active{

transform:scale(.94);

}




/* STATUS */


.section{

margin-top:35px;

font-size:22px;

font-weight:700;


}



.status{


margin-top:15px;

padding:22px;


border-radius:30px;



background:

rgba(255,255,255,.35);



backdrop-filter:

blur(40px);



border:

1px solid rgba(255,255,255,.6);


color:#6e6e73;


}





/* DOCK */


.dock{


position:fixed;


bottom:18px;


left:50%;


transform:translateX(-50%);



width:90%;


max-width:390px;



height:86px;


border-radius:42px;


padding:10px;



display:flex;

align-items:center;

justify-content:space-around;



}



.item{


width:95px;

height:64px;


border-radius:26px;



display:flex;

flex-direction:column;


justify-content:center;

align-items:center;



font-size:12px;


color:#8e8e93;


}



.icon{

font-size:26px;

}



.item.active{


background:

rgba(255,255,255,.65);



color:#000;



box-shadow:


inset 0 0 30px rgba(255,255,255,.9),


0 10px 30px rgba(0,0,0,.1);


}




.item:active{

transform:scale(.9);

}


</style>

</head>



<body>


<div class="app">


<div class="header">


<div class="logo">
⭐ RIRKA Ads
</div>


<div class="avatar">
👤
</div>


</div>




<div class="hero">


<h1>
Реклама.<br>
Новый уровень.
</h1>


<p>
Создавайте заявки и получайте размещение через проверку администрации.
</p>


</div>





<div class="glass">


<div class="title">
📝 Создать заявку
</div>


<div class="text">
Опишите вашу рекламу и получите ответ с условиями размещения.
</div>


<div class="liquid-button" onclick="window.location.href='form.html'">
✨ Начать
</div>



</div>




<div class="section">
Активность
</div>



<div class="status">

⏳ Нет активных заявок

</div>




</div>





<div class="dock">


<div class="item active">

<div class="icon">
⌂
</div>

Главная

</div>



<div class="item">

<div class="icon">
▤
</div>

Заявки

</div>



<div class="item">

<div class="icon">
◯
</div>

Профиль

</div>



</div>



</body>
</html>
