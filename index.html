<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIRKA Ads</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;

    background:
    radial-gradient(circle at top, #ffffff 0%, #f2f2f7 45%, #e5e5ea 100%);

    display: flex;
    justify-content: center;
    align-items: center;
}


.container {
    width: 90%;
    max-width: 420px;
}


.logo {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}


h1 {
    text-align: center;
    font-size: 34px;
    margin: 0;

    letter-spacing: -1px;
}


.subtitle {
    text-align: center;
    color: #6e6e73;
    margin: 12px 0 35px;
    font-size: 17px;
}



.glass {

    background:
    rgba(255,255,255,0.55);

    backdrop-filter:
    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);


    border:
    1px solid rgba(255,255,255,0.8);


    border-radius:
    28px;


    padding:
    20px;


    margin-bottom:
    16px;


    box-shadow:
    0 10px 40px rgba(0,0,0,0.08);


}


.button-title {
    font-size: 20px;
    font-weight: 600;
}


.button-text {
    color:#6e6e73;
    margin-top:6px;
    font-size:15px;
}


</style>

</head>


<body>


<div class="container">


<div class="logo">
⭐
</div>


<h1>
RIRKA Ads
</h1>


<div class="subtitle">
Официальный сервис рекламы
</div>



<div class="glass">

<div class="button-title">
📝 Заказать рекламу
</div>

<div class="button-text">
Создать новую заявку
</div>

</div>



<div class="glass">

<div class="button-title">
📋 Правила
</div>

<div class="button-text">
Перед размещением ознакомьтесь с условиями
</div>

</div>



<div class="glass">

<div class="button-title">
📦 Мои заявки
</div>

<div class="button-text">
Отслеживание статуса рекламы
</div>

</div>



</div>


</body>
</html>
