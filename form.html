<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Создание заявки</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
sans-serif;

background:

radial-gradient(
circle at 10% 10%,
rgba(120,190,255,.55),
transparent 35%
),

radial-gradient(
circle at 90% 90%,
rgba(220,150,255,.55),
transparent 40%
),

#f2f2f7;

color:#111;

}



.app{

padding:25px 20px 50px;

max-width:430px;

margin:auto;

}



.top{

display:flex;

align-items:center;

gap:15px;

}


.back{

width:45px;

height:45px;

border-radius:50%;


display:flex;

align-items:center;

justify-content:center;


font-size:22px;


background:

rgba(255,255,255,.55);


backdrop-filter:

blur(40px);


border:

1px solid rgba(255,255,255,.7);

}



h1{

font-size:34px;

letter-spacing:-1px;

margin-top:35px;

margin-bottom:8px;

}



.subtitle{

color:#6e6e73;

font-size:17px;

}




.glass{


margin-top:30px;


padding:25px;


border-radius:35px;


background:

linear-gradient(

135deg,

rgba(255,255,255,.7),

rgba(255,255,255,.2)

);



backdrop-filter:

blur(50px)
saturate(180%);



border:

1px solid rgba(255,255,255,.7);



box-shadow:

0 25px 70px rgba(0,0,0,.12),

inset 0 1px 2px white;



}




label{

display:block;

margin-top:18px;

font-size:14px;

color:#6e6e73;

}



input,
textarea,
select{


width:100%;


margin-top:8px;


padding:16px;


border-radius:20px;


border:none;


outline:none;


font-size:16px;


background:

rgba(255,255,255,.55);



backdrop-filter:

blur(20px);


}



textarea{

height:120px;

resize:none;

}



.send{


margin-top:25px;


height:60px;


border-radius:25px;


display:flex;

align-items:center;

justify-content:center;


font-size:18px;

font-weight:600;



background:

linear-gradient(

135deg,

rgba(255,255,255,.9),

rgba(255,255,255,.35)

);



border:

1px solid rgba(255,255,255,.8);



box-shadow:

0 15px 40px rgba(0,0,0,.1);



}



.send:active{

transform:scale(.95);

}


</style>

</head>


<body>


<div class="app">


<div class="top">

<div class="back" onclick="history.back()">

‹

</div>


</div>



<h1>
Новая заявка
</h1>


<div class="subtitle">

Расскажите о рекламе, мы проверим её и предложим условия.

</div>




<div class="glass">


<label>
Название проекта
</label>

<input placeholder="Например: RIRKA Store">



<label>
Что рекламируем?
</label>

<input placeholder="Описание рекламы">



<label>
Ссылка
</label>

<input placeholder="https://...">



<label>
Текст поста на канале
</label>

<textarea placeholder="Текст, который должен будет появиться в канале"></textarea>



<label>
Срок рекламы
</label>


<select>

<option>
1 день
</option>

<option>
3 дня
</option>

<option>
7 дней
</option>

<option>
Другое
</option>

</select>



<div 


<div class="send" onclick="sendRequest()">

🚀 Отправить заявку

</div>


</div>


<script>

function sendRequest(){

alert("✅ Заявка отправлена на проверку администрации!");

}

</script>


</body>
</html>
